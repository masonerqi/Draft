<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <i data-lucide="file-text"></i>
      <span>Draft</span>
    </div>

    <button type="button" class="sidebar-button" id="new-session-btn">
      <span>New summary</span>
    </button>

    <div class="sidebar-section">
      <div class="sidebar-label">EXPLORE</div>
      <button type="button" class="nav-item nav-item-record active" id="nav-record-btn">
        <i data-lucide="mic"></i>
        <span>Quick Record</span>
      </button>
      <button type="button" class="nav-item nav-item-disabled" id="nav-import-btn" aria-disabled="true" disabled>
        <i data-lucide="file-text"></i>
        <span>Import</span>
        <span class="badge-red">Coming Soon</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">PAST SESSIONS</div>
      <ul class="history-list" id="history-list">
        <li class="history-empty">No sessions yet.</li>
      </ul>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="profile-card">
      <div class="profile-avatar" id="profile-initials">D</div>
      <div class="profile-details">
        <div class="profile-name" id="profile-name">Guest</div>
        <div class="profile-email" id="profile-email">Not signed in</div>
      </div>
    </div>
    <div class="footer-actions">
      <button type="button" class="icon-button" id="settings-btn" title="API Key settings">
        <i data-lucide="key"></i>
      </button>
      <button type="button" class="icon-button" id="logout-btn" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </div>
</aside>
