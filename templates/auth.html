<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if show_register %}Register{% else %}Sign in{% endif %} · Draft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/static/css/main.css?v=4" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=2" />
</head>
<body>
  <main class="auth-wrapper">
    <section class="card card--auth animate-fade-up">
      <img src="{{ url_for('static', filename='images/logo_black.svg') }}" alt="Draft" class="auth-logo" />

      {% if show_register %}
        <h1>Create your account</h1>
        <p class="auth-intro">Save, search, and revisit your meeting summaries.</p>

        <form id="auth-form">
          <div class="form-group floating-label">
            <input
              type="text"
              id="name"
              name="name"
              placeholder=" "
              autocomplete="name"
              required
            />
            <label for="name">Full Name</label>
          </div>

          <div class="form-group floating-label">
            <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required />
            <label for="email">Email</label>
          </div>

          <div class="form-group floating-label">
            <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" minlength="6" required />
            <label for="password">Password</label>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Create account</button>
          <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login_page') }}">Sign in</a></p>
          <p id="error-message" class="auth-message" role="alert"></p>
        </form>

      {% else %}
        <h1>Welcome back</h1>
        <p class="auth-intro">Sign in to continue to your meeting workspace.</p>

        <form id="auth-form">
          <div class="form-group floating-label">
            <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required />
            <label for="email">Email</label>
          </div>

          <div class="form-group floating-label">
            <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required />
            <label for="password">Password</label>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>

          <div class="auth-divider"><span>OR</span></div>

          <button type="button" id="google-btn" class="btn-secondary">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="width:18px; margin-right:8px; vertical-align:middle;" />
            Continue with Google
          </button>

          <div class="auth-footer-links">
            <a href="#" id="forgot-password-link">Forgot password?</a>
            <a href="{{ url_for('auth.register') }}">Create account</a>
          </div>

          <p id="error-message" class="auth-message" role="alert"></p>
        </form>
      {% endif %}
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      sendPasswordResetEmail,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAf8ytTTyQo5ndX7PcetZFyp1W9ubs2aH4",
      authDomain: "draft-d36c3.firebaseapp.com",
      projectId: "draft-d36c3",
      storageBucket: "draft-d36c3.firebasestorage.app",
      messagingSenderId: "461424094330",
      appId: "1:461424094330:web:899ba79be001a2a843dfc3",
      measurementId: "G-K8YTKBYCC0"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const authForm = document.getElementById("auth-form");
    const errorMessage = document.getElementById("error-message");
    const submitBtn = document.getElementById("submit-btn");
    const isRegisterPage = "{{ 'true' if show_register else 'false' }}" === "true";

    function setStatus(msg, isError = true) {
      errorMessage.textContent = msg;
      errorMessage.classList.toggle("auth-message--success", !isError);
    }

    // Swaps a button's label for a small pulsing "wave" the instant it's
    // clicked, so a slow network round trip (e.g. a cold-started backend)
    // never reads as an unregistered click.
    function setButtonLoading(btn, loading) {
      if (!btn) return;
      if (loading) {
        if (!btn.querySelector(".btn-loading-bars")) {
          const bars = document.createElement("span");
          bars.className = "btn-loading-bars";
          bars.innerHTML = "<span></span><span></span><span></span><span></span>";
          btn.appendChild(bars);
        }
        btn.classList.add("is-loading");
        btn.disabled = true;
      } else {
        btn.classList.remove("is-loading");
        btn.disabled = false;
      }
    }

    // Toast-style confirmation after a self-serve account deletion redirects
    // here. Strip the query param so a page refresh doesn't re-show it.
    if (new URLSearchParams(window.location.search).get("deleted") === "1") {
      setStatus("Your account and data have been permanently deleted.", false);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    function parseAuthError(code) {
      switch (code) {
        case 'auth/email-already-in-use':
          return 'An account with this email already exists.';
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          return 'Invalid email or password.';
        case 'auth/weak-password':
          return 'Password should be at least 6 characters long.';
        default:
          return null;
      }
    }

    // Google Sign-In Handler
    const googleBtn = document.getElementById("google-btn");
    if (googleBtn) {
      const googleProvider = new GoogleAuthProvider();
      googleBtn.addEventListener("click", async () => {
        setButtonLoading(googleBtn, true);
        try {
          const result = await signInWithPopup(auth, googleProvider);
          const token = await result.user.getIdToken();

          const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ token })
          });

          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.message || "Server authentication failed.");
          }

          window.location.href = "/";
        } catch (error) {
          console.error("Google Auth Error:", error);
          setStatus(parseAuthError(error.code) || error.message);
        } finally {
          setButtonLoading(googleBtn, false);
        }
      });
    }

    // Form Submission Handler
    if (authForm) {
      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setButtonLoading(submitBtn, true);
        setStatus("");

        const email = document.getElementById("email")?.value.trim();
        const password = document.getElementById("password")?.value;

        try {
          if (isRegisterPage) {
            const name = document.getElementById("name").value.trim();

            const userCredential = await createUserWithEmailAndPassword(auth, email, password);

            // Sync display name to Firebase profile
            await updateProfile(userCredential.user, { displayName: name });

            // Best-effort: a verification email is a nice-to-have, not a
            // reason to fail the whole registration if it can't be sent.
            try {
              await sendEmailVerification(userCredential.user);
            } catch (verifyError) {
              console.warn("Unable to send verification email:", verifyError);
            }

            const token = await userCredential.user.getIdToken();

            const response = await fetch("/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ token, name })
            });

            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.message || "Registration failed on the server.");
            }

            setStatus(`Account created! We've sent a verification link to ${email} — check your inbox to confirm it.`, false);
            setTimeout(() => { window.location.href = "/"; }, 2200);
          } else {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const token = await userCredential.user.getIdToken();

            const response = await fetch("/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ token })
            });

            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.message || "Login failed on the server.");
            }

            window.location.href = "/";
          }
        } catch (error) {
          console.error("Auth Error:", error);
          setStatus(parseAuthError(error.code) || error.message);
        } finally {
          setButtonLoading(submitBtn, false);
        }
      });
    }

    // Password Reset Handler
    const forgotLink = document.getElementById("forgot-password-link");
    if (forgotLink) {
      forgotLink.addEventListener("click", async (event) => {
        event.preventDefault();
        const email = document.getElementById("email")?.value.trim();
        if (!email) {
          setStatus("Enter your email above to receive a password reset link.");
          return;
        }

        try {
          await sendPasswordResetEmail(auth, email);
          setStatus("Password reset email sent. Check your inbox.", false);
        } catch (error) {
          setStatus(parseAuthError(error.code) || error.message);
        }
      });
    }
  </script>
</body>
</html>
