<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Draft</title>
    <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="card card--auth animate-fade-up">
    <img src="{{ url_for('static', filename='images/draft_logo.png') }}" alt="Logo" style="height: 40px; margin-bottom: 16px;">

    <h2 id="form-title">Sign In</h2>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>

      <div class="auth-footer-links" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 0.85rem;">
        <a href="#" id="forgot-password-link" class="text-muted">Forgot password?</a>
        <a href="/register" class="text-muted">Need an account? <strong>Register</strong></a>
      </div>

      <div id="error-message" class="auth-message"></div>
    </form>
  </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyAf8ytTTyQo5ndX7PcetZFyp1W9ubs2aH4",
        authDomain: "draft-d36c3.firebaseapp.com",
        projectId: "draft-d36c3",
        storageBucket: "draft-d36c3.firebasestorage.app",
        messagingSenderId: "461424094330",
        appId: "1:461424094330:web:899ba79be001a2a843dfc3",
        measurementId: "G-K8YTKBYCC0"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLoginMode = true;

    const authForm = document.getElementById('auth-form');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-btn');
    const errorMessage = document.getElementById('error-message');

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
          isLoginMode = !isLoginMode;
          if (formTitle) formTitle.innerText = isLoginMode ? "Login" : "Register";
          if (submitBtn) submitBtn.innerText = isLoginMode ? "Sign In" : "Sign Up";
          toggleBtn.innerText = isLoginMode ? "Need an account? Register" : "Already have an account? Login";
          if (errorMessage) errorMessage.innerText = "";
      });
    }

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.innerText = "";

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            let userCredential;
            if (isLoginMode) {
                userCredential = await signInWithEmailAndPassword(auth, email, password);
            } else {
                userCredential = await createUserWithEmailAndPassword(auth, email, password);
            }

            // Prefer using the user's instance method to get the current token
            const token = await userCredential.user.getIdToken();

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ token })
            });

            if (response.ok) {
                window.location.href = '/';
            } else {
                const data = await response.json();
                errorMessage.innerText = data.message || "Authentication failed on server.";
            }

        } catch (error) {
            errorMessage.innerText = error.message;
        }
    });

    // Forgot password handler - sends password reset email via Firebase
    const forgotBtn = document.getElementById('forgot-password-link');
    if (forgotBtn) {
        forgotBtn.addEventListener('click', async (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                return errorMessage.innerText = 'Enter your email above to receive a password reset link.';
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert('Password reset email sent! Check your inbox.');
            } catch (err) {
                console.error('Error sending reset email:', err);
                alert('Could not send reset email: ' + (err.message || err));
            }
        });
    }</script>

</body>
</html>
