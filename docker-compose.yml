services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app:cached
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - SECRET_KEY=dev-secret-key-change-in-prod
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-credentials.json
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/draft_app
      - ADMIN_EMAILS=masonerqi@gmail.com
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=draft_app
    volumes:
      - draft_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  draft_app_pgdata:
